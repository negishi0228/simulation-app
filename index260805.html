<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新品・リユース使用シミュレーション</title>
<style>
    body {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        color: #333;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f4f7f6;
    }
    h1 {
        text-align: center;
        color: #2c3e50;
        font-size: 1.5rem;
    }
    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    @media (max-width: 600px) {
        .grid { grid-template-columns: 1fr; }
    }
    .card {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .card h2 {
        margin-top: 0;
        color: #34495e;
        border-bottom: 2px solid #3498db;
        padding-bottom: 10px;
        font-size: 1.2rem;
    }
    .card.reuse h2 {
        border-bottom: 2px solid #2ecc71;
    }
    .form-group {
        margin-bottom: 15px;
    }
    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        font-size: 0.9em;
        color: #555;
    }
    input[type="number"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 1rem;
    }
    .result-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 1rem;
    }
    .highlight {
        font-weight: bold;
        color: #e74c3c;
        font-size: 1.2em;
    }
    .result-box {
        margin-top: 20px;
        background: #e8f6f3;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #1abc9c;
        text-align: center;
    }
    .result-box h3 {
        margin-top: 0;
        color: #16a085;
    }
    #comparison-result {
        font-size: 1.2rem;
        color: #2c3e50;
    }
</style>
</head>
<body>

    <h1>📱 新品・リユース使用シミュレーション</h1>
    
    <div class="grid">
        <!-- 新品の入力エリア -->
        <div class="card">
            <h2>新品</h2>
            <div class="form-group">
                <label>初期費用 (円)</label>
                <input type="number" id="new-initial" value="120000" oninput="calculate()">
            </div>
            <div class="form-group">
                <label>想定使用年数 (年)</label>
                <input type="number" id="new-years" value="4" oninput="calculate()">
            </div>
            <div class="form-group">
                <label>年間維持費・修理費 (円)</label>
                <input type="number" id="new-maint" value="0" oninput="calculate()">
            </div>
            <div class="form-group">
                <label>手放す時の想定売却価格 (円)</label>
                <input type="number" id="new-resale" value="30000" oninput="calculate()">
            </div>
            <hr>
            <div class="result-row">
                <span>実質総コスト:</span>
                <span id="new-total">0 円</span>
            </div>
            <div class="result-row">
                <span>1年あたりの実質コスト:</span>
                <span id="new-annual" class="highlight">0 円</span>
            </div>
        </div>

        <!-- リユースの入力エリア -->
        <div class="card reuse">
            <h2>リユース</h2>
            <div class="form-group">
                <label>初期費用 (円)</label>
                <input type="number" id="reuse-initial" value="60000" oninput="calculate()">
            </div>
            <div class="form-group">
                <label>想定使用年数 (年)</label>
                <input type="number" id="reuse-years" value="2" oninput="calculate()">
            </div>
            <div class="form-group">
                <label>年間維持費・修理費 (円)</label>
                <input type="number" id="reuse-maint" value="5000" oninput="calculate()">
            </div>
            <div class="form-group">
                <label>手放す時の想定売却価格 (円)</label>
                <input type="number" id="reuse-resale" value="5000" oninput="calculate()">
            </div>
            <hr>
            <div class="result-row">
                <span>実質総コスト:</span>
                <span id="reuse-total">0 円</span>
            </div>
            <div class="result-row">
                <span>1年あたりの実質コスト:</span>
                <span id="reuse-annual" class="highlight">0 円</span>
            </div>
        </div>
    </div>

    <!-- 比較結果エリア -->
    <div class="result-box">
        <h3>💡 比較結果</h3>
        <div id="comparison-result">数値を入力して計算してください。</div>
    </div>

    <script>
        function calculate() {
            // 入力値を取得する関数（未入力時は0として扱う）
            const getVal = (id) => parseFloat(document.getElementById(id).value) || 0;
            
            // --- 新品の計算 ---
            const nInit = getVal('new-initial');
            const nYears = getVal('new-years') || 1; // 0除算を防ぐため最低1年
            const nMaint = getVal('new-maint');
            const nResale = getVal('new-resale');
            
            const nTotalCost = nInit + (nMaint * nYears) - nResale;
            const nAnnualCost = nTotalCost / nYears;
            
            document.getElementById('new-total').innerText = nTotalCost.toLocaleString() + ' 円';
            document.getElementById('new-annual').innerText = Math.round(nAnnualCost).toLocaleString() + ' 円';

            // --- リユースの計算 ---
            const rInit = getVal('reuse-initial');
            const rYears = getVal('reuse-years') || 1;
            const rMaint = getVal('reuse-maint');
            const rResale = getVal('reuse-resale');
            
            const rTotalCost = rInit + (rMaint * rYears) - rResale;
            const rAnnualCost = rTotalCost / rYears;
            
            document.getElementById('reuse-total').innerText = rTotalCost.toLocaleString() + ' 円';
            document.getElementById('reuse-annual').innerText = Math.round(rAnnualCost).toLocaleString() + ' 円';

            // --- 比較判定とメッセージ表示 ---
            const diff = Math.abs(nAnnualCost - rAnnualCost);
            const diffStr = Math.round(diff).toLocaleString();
            let compText = "";
            
            if(nAnnualCost > rAnnualCost) {
                compText = `1年あたりのコストは <strong>リユース</strong> の方が <strong>${diffStr}円</strong> お得です！`;
            } else if(rAnnualCost > nAnnualCost) {
                compText = `1年あたりのコストは <strong>新品</strong> の方が <strong>${diffStr}円</strong> お得です！`;
            } else {
                compText = `1年あたりのコストは <strong>全く同じ</strong> です。`;
            }
            document.getElementById('comparison-result').innerHTML = compText;
        }

        // ページ読み込み時に1回目の計算を実行
        calculate();
    </script>
</body>
</html>
